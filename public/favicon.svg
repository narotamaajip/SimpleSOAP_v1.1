<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Smartphone Frame Silhouette (centered vertically) -->
  <rect x="144" y="56" width="224" height="400" rx="36" fill="none" stroke="#10B981" stroke-width="24"/>
  
  <!-- Speaker/Sensor Notch -->
  <line x1="226" y1="84" x2="286" y2="84" stroke="#10B981" stroke-width="12" stroke-linecap="round"/>

  <!-- Sharp-edged Medical Cross (+) in medium-dark emerald -->
