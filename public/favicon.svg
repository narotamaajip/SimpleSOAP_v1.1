  <!-- Supporting color accents (3 Data Lines) -->
  <line x1="190" y1="326" x2="322" y2="326" stroke="#4B5563" stroke-width="14" stroke-linecap="round"/>
  <line x1="190" y1="361" x2="270" y2="361" stroke="#4B5563" stroke-width="14" stroke-linecap="round"/>
  <line x1="190" y1="396" x2="300" y2="396" stroke="#4B5563" stroke-width="14" stroke-linecap="round"/>
</svg>
