<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600">
  <!-- Smartphone Frame Silhouette -->
  <rect x="144" y="40" width="224" height="400" rx="36" fill="none" stroke="#10B981" stroke-width="24"/>
  
  <!-- Speaker/Sensor Notch (Increased thickness by 50% from 8 to 12) -->
  <line x1="226" y1="68" x2="286" y2="68" stroke="#10B981" stroke-width="12" stroke-linecap="round"/>

  <!-- Sharp-edged Medical Cross (+) in medium-dark emerald -->
  <path d="M256 164v100M206 214h100" stroke="#059669" stroke-width="44" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Supporting color accents (3 Data Lines) -->
  <line x1="190" y1="310" x2="322" y2="310" stroke="#4B5563" stroke-width="14" stroke-linecap="round"/>
  <line x1="190" y1="345" x2="270" y2="345" stroke="#4B5563" stroke-width="14" stroke-linecap="round"/>
  <line x1="190" y1="380" x2="300" y2="380" stroke="#4B5563" stroke-width="14" stroke-linecap="round"/>

  <!-- Brand Text (Figtree 600) -->
  <text x="256" y="520" font-family="Figtree, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="600" fill="#4B5563" text-anchor="middle">SimpleSOAP</text>
</svg>
